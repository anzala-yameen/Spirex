<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051923" />
      <stop offset="100%" stop-color="#006494" />
    </linearGradient>
    <linearGradient id="emeraldCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>
    <filter id="glowAI" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgAI)" />
  <circle cx="200" cy="150" r="260" fill="#10b981" opacity="0.1" filter="url(#glowAI)" />
  <circle cx="1000" cy="520" r="300" fill="#00f3ff" opacity="0.1" filter="url(#glowAI)" />

  <!-- Main Workflow Canvas Container -->
  <rect x="100" y="70" width="1000" height="535" rx="20" fill="rgba(6, 20, 32, 0.88)" stroke="url(#emeraldCyan)" stroke-width="2" />

  <!-- Top Bar with Star Performer Badge -->
  <rect x="100" y="70" width="1000" height="65" fill="rgba(10, 30, 45, 0.95)" />
  <text x="140" y="110" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900">⚡ SMART AI WORKFLOW &amp; AUTOMATION SUITE</text>

  <rect x="800" y="87" width="270" height="34" rx="17" fill="rgba(251, 191, 36, 0.2)" stroke="#fbbf24" stroke-width="1.5" />
  <text x="935" y="109" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold">★ STAR PERFORMER AWARD WINNER</text>

  <!-- Workflow Node Diagram -->
  <!-- Node 1: Input Data -->
  <rect x="150" y="240" width="180" height="120" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="2" />
  <text x="240" y="285" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="15" font-weight="bold">Data Ingestion</text>
  <text x="240" y="315" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="12">API &amp; CSV Trigger</text>

  <!-- Connector Line 1 -->
  <path d="M 330 300 L 450 300" stroke="#00f3ff" stroke-width="3" stroke-dasharray="6 4" />

  <!-- Node 2: AI Processing Engine -->
  <rect x="450" y="210" width="240" height="180" rx="16" fill="rgba(0, 243, 255, 0.15)" stroke="#00f3ff" stroke-width="2.5" filter="url(#glowAI)" />
  <text x="570" y="255" text-anchor="middle" fill="#00f3ff" font-family="sans-serif" font-size="17" font-weight="900">🧠 AI Model Engine</text>
  <text x="570" y="285" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13">Automated Decisioning</text>

  <rect x="480" y="310" width="180" height="28" rx="14" fill="#00f3ff" opacity="0.2" />
  <text x="570" y="329" text-anchor="middle" fill="#00f3ff" font-family="sans-serif" font-size="12" font-weight="bold">Efficiency Gain: +84%</text>

  <!-- Connector Line 2 -->
  <path d="M 690 300 L 810 300" stroke="#00f3ff" stroke-width="3" stroke-dasharray="6 4" />

  <!-- Node 3: Automated Action Output -->
  <rect x="810" y="240" width="220" height="120" rx="14" fill="rgba(157, 78, 221, 0.15)" stroke="#9d4edd" stroke-width="2" />
  <text x="920" y="285" text-anchor="middle" fill="#9d4edd" font-family="sans-serif" font-size="15" font-weight="bold">Automated Output</text>
  <text x="920" y="315" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="12">TSD &amp; Report Generation</text>

  <!-- Bottom Analytics Bar -->
  <rect x="150" y="440" width="880" height="110" rx="14" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.08)" />
  <text x="180" y="478" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Process Automation Summary:</text>
  <text x="180" y="510" fill="#94a3b8" font-family="sans-serif" font-size="13">Engineered for Excelerate / Saint Louis University internship to streamline task pipelines automatically.</text>

  <text x="980" y="495" text-anchor="end" fill="#10b981" font-family="sans-serif" font-size="22" font-weight="900">✓ 100% Executed</text>

</svg>
