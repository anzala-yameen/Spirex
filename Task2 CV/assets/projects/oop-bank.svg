<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#121a2d" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <circle cx="200" cy="150" r="250" fill="#00f3ff" opacity="0.08" filter="url(#glow)" />
  <circle cx="1000" cy="500" r="300" fill="#9d4edd" opacity="0.08" filter="url(#glow)" />
  
  <!-- Code/Tech Grid Overlay -->
  <g opacity="0.1" stroke="#00f3ff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#00f3ff" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="675" fill="url(#grid)" />
  </g>
  
  <!-- Main IDE Glass Dashboard Card -->
  <rect x="120" y="80" width="960" height="515" rx="20" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(0, 243, 255, 0.3)" stroke-width="2" />
  
  <!-- Header Bar -->
  <path d="M 120 100 Q 120 80 140 80 L 1060 80 Q 1080 80 1080 100 L 1080 130 L 120 130 Z" fill="rgba(30, 41, 59, 0.8)" />
  <circle cx="150" cy="105" r="7" fill="#ef4444" />
  <circle cx="175" cy="105" r="7" fill="#f59e0b" />
  <circle cx="200" cy="105" r="7" fill="#10b981" />
  <text x="230" y="110" fill="#94a3b8" font-family="monospace" font-size="14">BankManager.cpp - OOP Software Architecture</text>
  
  <!-- Left Code Panel -->
  <rect x="150" y="160" width="420" height="400" rx="12" fill="rgba(7, 10, 19, 0.9)" stroke="rgba(255,255,255,0.05)" />
  <text x="175" y="200" fill="#9d4edd" font-family="monospace" font-size="16" font-weight="bold">class BankAccount {</text>
  <text x="195" y="230" fill="#00f3ff" font-family="monospace" font-size="14">private:</text>
  <text x="215" y="255" fill="#cbd5e1" font-family="monospace" font-size="14">string accountNumber;</text>
  <text x="215" y="280" fill="#cbd5e1" font-family="monospace" font-size="14">double accountBalance;</text>
  <text x="195" y="315" fill="#00f3ff" font-family="monospace" font-size="14">public:</text>
  <text x="215" y="340" fill="#10b981" font-family="monospace" font-size="14">void deposit(double amount);</text>
  <text x="215" y="365" fill="#10b981" font-family="monospace" font-size="14">bool withdraw(double amount);</text>
  <text x="215" y="390" fill="#fbbf24" font-family="monospace" font-size="14">double getBalance() const;</text>
  <text x="175" y="425" fill="#9d4edd" font-family="monospace" font-size="16" font-weight="bold">};</text>
  <text x="175" y="465" fill="#64748b" font-family="monospace" font-size="13">// Encapsulation &amp; Security Active</text>
  
  <!-- Right Visual Banking UI Panel -->
  <rect x="600" y="160" width="450" height="400" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="url(#cyanPurple)" stroke-width="1.5" />
  
  <!-- Card Header -->
  <text x="630" y="205" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">ENTERPRISE OOP BANKING</text>
  <text x="630" y="230" fill="#00f3ff" font-family="monospace" font-size="14">SYSTEM ARCHITECTURE</text>
  
  <!-- Account Card Widget -->
  <rect x="630" y="260" width="390" height="110" rx="12" fill="url(#goldGrad)" opacity="0.9" />
  <text x="655" y="295" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">VIP SAVINGS ACCOUNT</text>
  <text x="655" y="330" fill="#0f172a" font-family="sans-serif" font-size="28" font-weight="900">$142,850.00</text>
  <text x="920" y="295" fill="#0f172a" font-family="monospace" font-size="13">**** 9821</text>
  
  <!-- Audit Log Rows -->
  <rect x="630" y="390" width="390" height="45" rx="8" fill="rgba(30, 41, 59, 0.8)" />
  <circle cx="655" cy="412" r="8" fill="#10b981" />
  <text x="675" y="417" fill="#e2e8f0" font-family="sans-serif" font-size="14">Deposit Approved</text>
  <text x="940" y="417" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="bold">+$5,000</text>
  
  <rect x="630" y="445" width="390" height="45" rx="8" fill="rgba(30, 41, 59, 0.8)" />
  <circle cx="655" cy="467" r="8" fill="#00f3ff" />
  <text x="675" y="472" fill="#e2e8f0" font-family="sans-serif" font-size="14">Interest Computed (3.5%)</text>
  <text x="940" y="472" fill="#00f3ff" font-family="sans-serif" font-size="14" font-weight="bold">+$418.25</text>
  
  <!-- Bottom Status Pill -->
  <rect x="630" y="505" width="390" height="35" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
  <text x="825" y="527" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="13">✓ C++ / Java OOP Inheritance &amp; Data Security Verified</text>

</svg>
