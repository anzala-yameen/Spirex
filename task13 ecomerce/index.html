<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpireX Shop | Premium E-Commerce</title>
    <meta name="description" content="Discover premium products at SpireX Shop. Responsive and modern e-commerce experience.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="logo">SpireX<span>Shop</span></div>
        <nav>
            <ul class="nav-links">
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#products">Products</a></li>
            </ul>
        </nav>
        <div class="cart-icon-container" id="cart-toggle">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="cart-icon"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span class="cart-count" id="cart-count">0</span>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Elevate Your Lifestyle</h1>
                <p>Discover our curated collection of premium products designed for modern living.</p>
                <a href="#products" class="cta-button">Shop Now</a>
            </div>
        </section>

        <section id="products" class="products-section">
            <h2 class="section-title">Featured Products</h2>
            <div class="product-grid" id="product-grid">
                <!-- Products will be injected here via JavaScript -->
            </div>
        </section>
    </main>

    <!-- Cart Sidebar -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <aside class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-cart" id="close-cart">&times;</button>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- Cart items will be injected here -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">$0.00</span>
            </div>
            <button class="checkout-button" id="checkout-button" disabled>Checkout</button>
        </div>
    </aside>

    <!-- Product Modal -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">&times;</button>
            <div class="modal-body" id="modal-body">
                <!-- Modal content injected via JS -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
