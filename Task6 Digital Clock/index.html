<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Clock</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <main class="clock-section">

        <div class="clock-card">

            <div class="clock-header">
                <span class="status-dot"></span>
                <span>LIVE TIME</span>
            </div>

            <div class="clock" id="clock">
                <span id="hours">00</span>
                <span class="colon">:</span>
                <span id="minutes">00</span>
                <span class="colon">:</span>
                <span id="seconds">00</span>
            </div>

            <div class="period" id="period">
                AM
            </div>

            <div class="date" id="date">
                Monday, January 01, 2026
            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
