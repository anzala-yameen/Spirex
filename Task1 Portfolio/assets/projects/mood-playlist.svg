<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAudio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2d" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="magentaViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>
    <filter id="glowAudio" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgAudio)" />
  <circle cx="250" cy="200" r="300" fill="#ff2a85" opacity="0.1" filter="url(#glowAudio)" />
  <circle cx="950" cy="450" r="320" fill="#9d4edd" opacity="0.12" filter="url(#glowAudio)" />

  <!-- Player Outer Glass Container -->
  <rect x="150" y="80" width="900" height="515" rx="24" fill="rgba(25, 12, 45, 0.85)" stroke="url(#magentaViolet)" stroke-width="2" />

  <!-- Left Mood Selector & Vinyl -->
  <circle cx="340" cy="300" r="120" fill="#090514" stroke="url(#magentaViolet)" stroke-width="6" />
  <circle cx="340" cy="300" r="90" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <circle cx="340" cy="300" r="60" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <circle cx="340" cy="300" r="30" fill="url(#magentaViolet)" />

  <!-- Mood Badge -->
  <rect x="220" y="460" width="240" height="45" rx="22" fill="rgba(255, 42, 133, 0.2)" stroke="#ff2a85" stroke-width="1.5" />
  <text x="340" y="488" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">🎧 Current Mood: ENERGETIC</text>

  <!-- Right Player & Equalizer -->
  <text x="540" y="140" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="900">AUTOMATIC MOOD PLAYLIST</text>
  <text x="540" y="165" fill="#00f3ff" font-family="monospace" font-size="14">AI EMOTION &amp; AUDIO ENGINE</text>

  <!-- Dynamic Equalizer Bars -->
  <g fill="url(#magentaViolet)">
    <rect x="540" y="200" width="12" height="90" rx="6" />
    <rect x="562" y="180" width="12" height="110" rx="6" />
    <rect x="584" y="220" width="12" height="70" rx="6" />
    <rect x="606" y="160" width="12" height="130" rx="6" />
    <rect x="628" y="190" width="12" height="100" rx="6" />
    <rect x="650" y="240" width="12" height="50" rx="6" />
    <rect x="672" y="170" width="12" height="120" rx="6" />
    <rect x="694" y="210" width="12" height="80" rx="6" />
    <rect x="716" y="180" width="12" height="110" rx="6" />
    <rect x="738" y="230" width="12" height="60" rx="6" />
    <rect x="760" y="160" width="12" height="130" rx="6" />
    <rect x="782" y="200" width="12" height="90" rx="6" />
    <rect x="804" y="220" width="12" height="70" rx="6" />
    <rect x="826" y="190" width="12" height="100" rx="6" />
    <rect x="848" y="170" width="12" height="120" rx="6" />
    <rect x="870" y="210" width="12" height="80" rx="6" />
  </g>

  <!-- Generated Tracklist -->
  <rect x="540" y="320" width="460" height="50" rx="10" fill="rgba(255,255,255,0.06)" />
  <text x="565" y="352" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">1. Cyber Synthwave - Neon Horizon</text>
  <text x="960" y="352" text-anchor="end" fill="#00f3ff" font-family="monospace" font-size="13">3:42</text>

  <rect x="540" y="380" width="460" height="50" rx="10" fill="rgba(255,255,255,0.03)" />
  <text x="565" y="412" fill="#cbd5e1" font-family="sans-serif" font-size="14">2. Ambient Lofi Beats - Deep Focus</text>
  <text x="960" y="412" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="13">2:55</text>

  <rect x="540" y="440" width="460" height="50" rx="10" fill="rgba(255,255,255,0.03)" />
  <text x="565" y="472" fill="#cbd5e1" font-family="sans-serif" font-size="14">3. High Energy Synth - Future Pulse</text>
  <text x="960" y="472" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="13">4:10</text>

  <!-- Bottom Player Control Bar -->
  <rect x="540" y="505" width="460" height="45" rx="8" fill="rgba(157, 78, 221, 0.2)" stroke="#9d4edd" stroke-width="1" />
  <text x="770" y="533" text-anchor="middle" fill="#00f3ff" font-family="sans-serif" font-size="13" font-weight="bold">▶ Playing AI Selected Playlist | Web Audio Synth active</text>

</svg>
