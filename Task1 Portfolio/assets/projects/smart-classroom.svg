<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgClassroom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#001f54" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#03a9f4" />
    </linearGradient>
    <filter id="glowClass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgClassroom)" />
  <circle cx="950" cy="150" r="280" fill="#00f3ff" opacity="0.08" filter="url(#glowClass)" />
  <circle cx="200" cy="500" r="250" fill="#3b82f6" opacity="0.1" filter="url(#glowClass)" />

  <!-- Main Portal Shell -->
  <rect x="100" y="70" width="1000" height="535" rx="24" fill="rgba(10, 25, 47, 0.85)" stroke="url(#neonCyan)" stroke-width="2" />

  <!-- Top Bar -->
  <rect x="100" y="70" width="1000" height="60" fill="rgba(15, 30, 60, 0.9)" />
  <text x="140" y="107" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900">🎓 AI SMART CLASSROOM ANALYTICS PORTAL</text>
  <rect x="890" y="87" width="180" height="32" rx="16" fill="rgba(0, 243, 255, 0.2)" stroke="#00f3ff" stroke-width="1" />
  <text x="980" y="108" text-anchor="middle" fill="#00f3ff" font-family="sans-serif" font-size="13" font-weight="bold">● LIVE AI CAMERA FEED</text>

  <!-- Left AI Attendance Visualizer -->
  <rect x="140" y="160" width="440" height="400" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.1)" />
  <text x="170" y="195" fill="#00f3ff" font-family="sans-serif" font-size="16" font-weight="bold">Facial Recognition Attendance Grid</text>

  <!-- Student Face Frames -->
  <g fill="none" stroke="#00f3ff" stroke-width="2">
    <rect x="170" y="220" width="110" height="110" rx="12" fill="rgba(0,243,255,0.05)" />
    <circle cx="225" cy="260" r="24" fill="#38bdf8" />
    <path d="M 195 315 C 195 295, 255 295, 255 315" fill="#38bdf8" />
    <text x="225" y="348" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="12" stroke="none">✓ Identified 99.4%</text>

    <rect x="300" y="220" width="110" height="110" rx="12" fill="rgba(0,243,255,0.05)" />
    <circle cx="355" cy="260" r="24" fill="#a855f7" />
    <path d="M 325 315 C 325 295, 385 295, 385 315" fill="#a855f7" />
    <text x="355" y="348" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="12" stroke="none">✓ Identified 98.9%</text>

    <rect x="430" y="220" width="110" height="110" rx="12" fill="rgba(0,243,255,0.05)" />
    <circle cx="485" cy="260" r="24" fill="#ec4899" />
    <path d="M 455 315 C 455 295, 515 295, 515 315" fill="#ec4899" />
    <text x="485" y="348" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="12" stroke="none">✓ Identified 99.8%</text>
  </g>

  <!-- Live Stats -->
  <rect x="170" y="380" width="370" height="150" rx="12" fill="rgba(30, 41, 59, 0.8)" stroke="none" />
  <text x="195" y="415" fill="#94a3b8" font-family="sans-serif" font-size="14">Total Students Present:</text>
  <text x="490" y="415" text-anchor="end" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">42 / 45</text>

  <text x="195" y="455" fill="#94a3b8" font-family="sans-serif" font-size="14">Attentiveness Score:</text>
  <text x="490" y="455" text-anchor="end" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="bold">94.2%</text>

  <rect x="195" y="480" width="295" height="12" rx="6" fill="rgba(255,255,255,0.1)" />
  <rect x="195" y="480" width="278" height="12" rx="6" fill="#10b981" />

  <!-- Right Analytics Panel -->
  <rect x="610" y="160" width="450" height="400" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.1)" />
  <text x="640" y="195" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Classroom Engagement Metrics</text>

  <!-- Waveform Graph -->
  <path d="M 640 330 Q 700 240, 750 300 T 860 220 T 960 310 T 1030 250" fill="none" stroke="#00f3ff" stroke-width="4" filter="url(#glowClass)" />
  <path d="M 640 330 Q 700 240, 750 300 T 860 220 T 960 310 T 1030 250 L 1030 380 L 640 380 Z" fill="rgba(0, 243, 255, 0.1)" />

  <rect x="640" y="410" width="400" height="120" rx="12" fill="rgba(30, 41, 59, 0.8)" />
  <text x="665" y="445" fill="#00f3ff" font-family="sans-serif" font-size="14" font-weight="bold">🤖 AI Computer Vision Insights</text>
  <text x="665" y="475" fill="#cbd5e1" font-family="sans-serif" font-size="13">Automated log generated for BS Software Engineering Lecture.</text>
  <text x="665" y="500" fill="#10b981" font-family="sans-serif" font-size="13">High engagement detected during Python ML module explanation.</text>

</svg>
